
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Medical Record</title>
</head>

<body>

    <h1>Add Medical Record</h1>

    <form th:action="@{/medical-records}"
          th:object="${medicalRecord}"
          method="post">

        <label for="patient">
            Patient:
        </label>

        <select id="patient"
                name="patient.id"
                required>

            <option value="">
                Select Patient
            </option>

            <option th:each="patient : ${patients}"
                    th:value="${patient.id}"
                    th:text="${patient.name}">
            </option>

        </select>

        <br><br>

        <label for="diagnosis">
            Diagnosis:
        </label>

        <input type="text"
               id="diagnosis"
               th:field="*{diagnosis}"
               required>

        <br><br>

        <label for="treatment">
            Treatment:
        </label>

        <input type="text"
               id="treatment"
               th:field="*{treatment}"
               required>

        <br><br>

        <label for="notes">
            Notes:
        </label>

        <textarea id="notes"
                  th:field="*{notes}"
                  rows="4"
                  cols="40">
        </textarea>

        <br><br>

        <label for="recordDate">
            Record Date:
        </label>

        <input type="date"
               id="recordDate"
               th:field="*{recordDate}"
               required>

        <br><br>

        <button type="submit">
            Save Medical Record
        </button>

    </form>

    <br>

    <a href="/medical-records">
        Back to Medical Records
    </a>

</body>

</html>
