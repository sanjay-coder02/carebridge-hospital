
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Records</title>
</head>

<body>

    <h1>Medical Records</h1>

    <a href="/medical-records/new">
        Add Medical Record
    </a>

    <br><br>

    <table border="1">

        <thead>

            <tr>
                <th>ID</th>
                <th>Patient</th>
                <th>Diagnosis</th>
                <th>Treatment</th>
                <th>Notes</th>
                <th>Record Date</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="record : ${medicalRecords}">

                <td th:text="${record.id}">
                </td>

                <td th:text="${record.patient.name}">
                </td>

                <td th:text="${record.diagnosis}">
                </td>

                <td th:text="${record.treatment}">
                </td>

                <td th:text="${record.notes}">
                </td>

                <td th:text="${record.recordDate}">
                </td>

                <td>
                    <a th:href="@{/medical-records/delete/{id}(id=${record.id})}"
                       onclick="return confirm('Are you sure you want to delete this medical record?');">
                        Delete
                    </a>
                </td>

            </tr>

        </tbody>

    </table>

</body>

</html>
