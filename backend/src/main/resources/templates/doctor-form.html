
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${doctor.id == null ? 'Add Doctor' : 'Edit Doctor'}">
        Doctor
    </title>
</head>
<body>

    <h1 th:text="${doctor.id == null ? 'Add Doctor' : 'Edit Doctor'}">
        Doctor
    </h1>

    <form th:action="@{/doctors}"
          th:object="${doctor}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <label for="name">Name:</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               required>

        <br><br>

        <label for="specialization">Specialization:</label>

        <select id="specialization"
                th:field="*{specialization}"
                required>

            <option value="">Select Specialization</option>

            <option value="General Physician">
                General Physician
            </option>

            <option value="Cardiologist">
                Cardiologist
            </option>

            <option value="Neurologist">
                Neurologist
            </option>

            <option value="Dermatologist">
                Dermatologist
            </option>

            <option value="Orthopedist">
                Orthopedist
            </option>

        </select>

        <br><br>

        <label for="phone">Phone:</label>
        <input type="text"
               id="phone"
               th:field="*{phone}"
               required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               th:field="*{email}">

        <br><br>

        <label for="location">Location:</label>
        <input type="text"
               id="location"
               th:field="*{location}">

        <br><br>

        <button type="submit"
                th:text="${doctor.id == null ? 'Save Doctor' : 'Update Doctor'}">
            Save Doctor
        </button>

    </form>

    <br>

    <a href="/doctors">Back to Doctors</a>

</body>
</html>
